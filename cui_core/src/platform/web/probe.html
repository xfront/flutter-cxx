<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #111318; overflow: hidden; }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<script>
  // Hand-driven probe (same Module wiring as web/shell.html) so the CDP
  // driver can read structured state instead of racing the virtual clock.
  var LOG = [];
  function say(s) {
    LOG.push(String(s));
    if (LOG.length > 200) LOG.shift();
  }
  window.__probe = { done: false, log: LOG, stats: null, clicks: [] };
  window.onerror = function (m, s, l, c, e) {
    say('ONERROR ' + m + ' @' + l + ':' + c + ' ' + (e && e.stack ? e.stack : ''));
    window.__probe.done = true;
  };
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (t) { say('OUT ' + t); },
    printErr: function (t) { say('ERR ' + t); },
    setStatus: function (t) { if (t) say('STATUS ' + t); },
    onRuntimeInitialized: function () {
      say('RINIT');
      setTimeout(function () {
        window.dispatchEvent(new Event('resize'));
        Module.canvas.focus();
      }, 0);
      setTimeout(sample, 500);
    },
    onAbort: function (w) { say('ABORT ' + w); window.__probe.done = true; }
  };

  function sample() {
    var c = Module.canvas;
    var ctx = c.getContext('2d');
    var d = ctx.getImageData(0, 0, c.width, c.height).data;
    var nonBlank = 0;
    var colors = {};
    for (var i = 0; i < d.length; i += 4) {
      var k = (d[i] << 16 | d[i + 1] << 8 | d[i + 2]).toString(16);
      if (k !== '111318' && k !== '0') {
        nonBlank++;
        colors[k] = (colors[k] || 0) + 1;
      }
    }
    var top = Object.keys(colors).sort(function (a, b) { return colors[b] - colors[a]; })
      .slice(0, 8).map(function (k) { return '#' + k + ':' + colors[k]; });
    window.__probe.stats = {
      w: c.width, h: c.height, dpr: devicePixelRatio,
      nonBlank: nonBlank, total: d.length / 4, top: top,
      distinct: Object.keys(colors).length
    };
  }

  // Click a point the way a user would, then re-sample.
  window.__probe.clickAt = function (x, y) {
    var c = Module.canvas;
    var r = c.getBoundingClientRect();
    var o = { bubbles: true, cancelable: true, clientX: x, clientY: y,
              button: 0, buttons: 1, pointerId: 1, pointerType: 'mouse' };
    c.dispatchEvent(new MouseEvent('mousedown', o));
    c.dispatchEvent(new MouseEvent('mouseup', Object.assign({}, o, { buttons: 0 })));
    setTimeout(function () { sample(); window.__probe.clicks.push(x + ',' + y); }, 200);
  };
</script>
<script async src="demo_gallery.js"></script>
</body>
</html>
